name: Sync zh-CN BI terminology

on:
  push:
    branches:
      - dev-zh-cn
    paths:
      - scripts/translations/zh_bi_overrides.json
      - scripts/translations/zh_bi_data_overrides.json
      - scripts/translations/zh_bi_cleanup_overrides.json
      - scripts/translations/zh_release_review_corrections.json
      - scripts/translations/zh_release_review_overrides.json
      - scripts/translations/finalize_zh_release_review.py
      - scripts/translations/apply_zh_bi_overrides.py
      - scripts/translations/normalize_zh_bi_terms.py
      - scripts/translations/audit_zh_bi_terms.py
      - scripts/translations/audit_zh_release_quality.py
      - scripts/translations/report_zh_remaining.py
      - .github/workflows/zh-bi-translation-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-translation-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev-zh-cn

      - name: Restore fork master translation baseline
        run: |
          git fetch origin master --depth=1
          git checkout origin/master -- superset/translations/zh/LC_MESSAGES/messages.po

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install translation tooling
        run: python -m pip install --disable-pip-version-check Babel

      - name: Apply BI terminology and release review
        run: |
          python scripts/translations/apply_zh_bi_overrides.py --allow-missing
          python scripts/translations/apply_zh_bi_overrides.py \
            --overrides scripts/translations/zh_bi_data_overrides.json \
            --allow-missing
          if [ -f scripts/translations/zh_bi_cleanup_overrides.json ]; then
            python scripts/translations/apply_zh_bi_overrides.py \
              --overrides scripts/translations/zh_bi_cleanup_overrides.json \
              --allow-missing
          fi
          if [ -f scripts/translations/zh_release_review_overrides.json ]; then
            python scripts/translations/apply_zh_bi_overrides.py \
              --overrides scripts/translations/zh_release_review_overrides.json \
              --allow-missing
          fi
          python scripts/translations/normalize_zh_bi_terms.py

      - name: Audit BI terminology
        run: python scripts/translations/audit_zh_bi_terms.py

      - name: Report remaining translation quality
        run: python scripts/translations/report_zh_remaining.py

      - name: Freeze completed release review
        run: python scripts/translations/finalize_zh_release_review.py

      - name: Audit release quality
        run: python scripts/translations/audit_zh_release_quality.py

      # Three static percent labels in upstream zh are misdetected by Babel as
      # Python %c/%o placeholders. Keep upstream-compatible compilation while
      # our release audit validates the real runtime placeholders independently.
      - name: Compile zh catalog (upstream-compatible)
        run: pybabel compile --use-fuzzy -d superset/translations -l zh || true

      - name: Commit materialized catalog and review state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add superset/translations/zh/LC_MESSAGES/messages.po scripts/translations/zh_fuzzy_review_queue.json
          if [ -f scripts/translations/zh_release_review_overrides.json ]; then
            git add scripts/translations/zh_release_review_overrides.json
          fi
          if git diff --cached --quiet; then
            echo "Chinese catalog and review state already match release review rules."
            exit 0
          fi
          git commit -m "fix(i18n): materialize zh-CN release review"
          git push origin HEAD:dev-zh-cn
